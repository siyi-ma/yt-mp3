<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS329A Transcript Browser</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f6f8fa;
      color: #1f2328;
    }
    * { box-sizing: border-box; }
    body { margin: 0; display: flex; min-height: 100vh; }
    .sidebar {
      width: 320px;
      background: #ffffff;
      border-right: 1px solid #d0d7de;
      padding: 16px;
      overflow-y: auto;
    }
    .sidebar h1 {
      font-size: 16px;
      margin: 0 0 8px 0;
    }
    .sidebar p {
      font-size: 12px;
      color: #57606a;
      margin: 0 0 12px 0;
    }
    .episode {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      background: #f6f8fa;
      cursor: pointer;
      font-size: 13px;
    }
    .episode:hover { background: #eef2f7; }
    .episode.active { background: #ddf4ff; border-color: #0969da; }
    .main { flex: 1; padding: 24px; overflow-y: auto; }
    .main h2 { margin: 0 0 16px 0; font-size: 20px; }
    .meta { color: #57606a; font-size: 13px; margin-bottom: 16px; }
    .transcript {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 15px;
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 16px;
    }
    .empty { color: #57606a; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h1>CS329A Transcripts</h1>
    <p>Stanford Self-Improving AI Agents</p>
    <div id="episode-list"></div>
  </aside>
  <main class="main">
    <h2 id="title">Select an episode</h2>
    <div id="meta" class="meta"></div>
    <div id="transcript" class="transcript empty">Choose a video from the left to view its transcript.</div>
  </main>

  <script>
    const episodes = [
      { id: "6YnLB0XbTnI", title: "Part 1 Course Overview", file: "6YnLB0XbTnI - Part 1 Course Overview.txt" },
      { id: "-Ggc37xLj_Y", title: "Part 2 Test-Time Compute Scaling", file: "-Ggc37xLj_Y - Part 2 Test-Time Compute Scaling.txt" },
      { id: "p7TdPUcPoik", title: "Part 3 Robust Verification", file: "p7TdPUcPoik - Part 3 Robust Verification.txt" },
      { id: "Lxh9RF5S-K0", title: "Part 4 Learning from Feedback with Tools/Code", file: "Lxh9RF5S-K0 - Part 4 Learning from Feedback with Tools Code.txt" },
      { id: "Ml_fp9XkB8Y", title: "Part 5 Planning and Multi-Step Reasoning", file: "Ml_fp9XkB8Y - Part 5 Planning and Multi-Step Reasoning.txt" },
      { id: "yVnmHSAy3ck", title: "Part 6 Train Time Scaling/Scaling RL", file: "yVnmHSAy3ck - Part 6 Train Time Scaling Scaling RL.txt" },
      { id: "Uni9dqyuuDM", title: "Part 7 Self-Improvement and Deep Research Agents", file: "Uni9dqyuuDM - Part 7 Self-Improvement and Deep Research Agents.txt" },
      { id: "8JAqLnTaZu4", title: "Part 8 Agentic Evaluations and Long Horizon Tasks", file: "8JAqLnTaZu4 - Part 8 Agentic Evaluations and Long Horizon Tasks.txt" },
      { id: "AyO6wyu4DEg", title: "Part 9 Future Research Areas", file: "AyO6wyu4DEg - Part 9 Future Research Areas.txt" }
    ];

    const listEl = document.getElementById("episode-list");
    const titleEl = document.getElementById("title");
    const metaEl = document.getElementById("meta");
    const transcriptEl = document.getElementById("transcript");

    episodes.forEach((ep, idx) => {
      const btn = document.createElement("button");
      btn.className = "episode";
      btn.textContent = ep.title;
      btn.addEventListener("click", async () => {
        document.querySelectorAll(".episode").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        titleEl.textContent = ep.title;
        metaEl.textContent = `https://www.youtube.com/watch?v=${ep.id}`;
        transcriptEl.classList.remove("empty");
        try {
          const res = await fetch(`content/transcripts/youtube/cs329a-stanford/${encodeURIComponent(ep.file)}`);
          const text = await res.text();
          transcriptEl.textContent = text;
        } catch (e) {
          transcriptEl.textContent = "Failed to load transcript: " + e.message;
        }
      });
      listEl.appendChild(btn);
    });
  </script>
</body>
</html>
